# Builds an installable Android TEST app (APK) connected to STAGING, on GitHub's servers.
# Runs when main changes, or by hand (Actions -> Android test build -> Run workflow).
# The APK is signed with the standard Android test (debug) key: for testing only, never for the Play Store.
# Every run writes its results (and the last lines of each log) to the branch "ci-results", so problems can be read without the Actions page.
name: Android test build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: android-test-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      CI: "1"
      EXPO_PUBLIC_APP_ENV: preview
      ANDROID_VERSION_CODE: ${{ github.run_number }}
      EXPO_PUBLIC_SUPABASE_URL: https://ckhoycpsjftavuqxxnss.supabase.co
      EXPO_PUBLIC_SUPABASE_KEY: ${{ secrets.STAGING_SUPABASE_KEY }}
      EXPO_PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.STAGING_TURNSTILE_SITE_KEY }}
      EXPO_PUBLIC_CAPTCHA_PAGE: https://amcolink-captcha-test.nasrullaah4444.workers.dev/
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Prepare log folder
        run: mkdir -p ci-logs

      - name: Stop if the staging key is missing
        id: key
        run: test -n "$EXPO_PUBLIC_SUPABASE_KEY" || (echo "Add the STAGING_SUPABASE_KEY secret" | tee ci-logs/key.log && exit 1)

      - name: Install
        id: install
        run: set -o pipefail; npm ci 2>&1 | tee ci-logs/install.log

      - name: Checks (types, design rules, unit tests)
        id: checks
        run: set -o pipefail; npm run check 2>&1 | tee ci-logs/checks.log

      - name: Staging integration tests (read-only)
        id: integration
        run: set -o pipefail; npm run test:integration 2>&1 | tee ci-logs/integration.log

      - name: Create the Android project
        id: prebuild
        run: set -o pipefail; npx expo prebuild --platform android --clean --no-install 2>&1 | tee ci-logs/prebuild.log

      - name: Build the test app
        id: gradle
        working-directory: android
        run: set -o pipefail; ./gradlew assembleRelease --no-daemon 2>&1 | tee ../ci-logs/gradle.log

      - name: Name the file
        id: name
        run: cp android/app/build/outputs/apk/release/app-release.apk "amcolink-staging-test-${{ github.run_number }}.apk"

      - name: Keep the file on this run
        uses: actions/upload-artifact@v4
        with:
          name: amcolink-staging-test-${{ github.run_number }}
          path: amcolink-staging-test-${{ github.run_number }}.apk
          retention-days: 14

      - name: Publish as a test release (easy download on the phone)
        id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-build-${{ github.run_number }}
          name: Test build ${{ github.run_number }} (staging)
          prerelease: true
          body: |
            Android TEST app connected to STAGING only. Not for real users.
            Commit: ${{ github.sha }}
          files: amcolink-staging-test-${{ github.run_number }}.apk

      - name: Write results to the ci-results branch
        if: always()
        env:
          RUN: ${{ github.run_number }}
          SHA: ${{ github.sha }}
          R_KEY: ${{ steps.key.outcome }}
          R_INSTALL: ${{ steps.install.outcome }}
          R_CHECKS: ${{ steps.checks.outcome }}
          R_INTEGRATION: ${{ steps.integration.outcome }}
          R_PREBUILD: ${{ steps.prebuild.outcome }}
          R_GRADLE: ${{ steps.gradle.outcome }}
          R_RELEASE: ${{ steps.release.outcome }}
          TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/results
          {
            echo "# Android test build $RUN"
            echo "commit: $SHA"
            echo "key: $R_KEY | install: $R_INSTALL | checks: $R_CHECKS | integration: $R_INTEGRATION | prebuild: $R_PREBUILD | gradle: $R_GRADLE | release: $R_RELEASE"
            for f in ci-logs/*.log; do
              [ -f "$f" ] || continue
              echo; echo "## $f (last 120 lines)"; echo '```'; tail -n 120 "$f"; echo '```'
            done
          } > /tmp/results/latest.md
          mkdir -p /tmp/out && cp /tmp/results/latest.md /tmp/out/latest.md && cp /tmp/results/latest.md "/tmp/out/build-$RUN.md"
          bash .github/scripts/push-results.sh /tmp/out "results of build $RUN"

  emulator:
    needs: build
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: amcolink-staging-test-${{ github.run_number }}

      - name: Allow the emulator to use hardware speed-up
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Maestro (UI test tool)
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Run the app on an Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: bash .maestro/run.sh

      - name: Write emulator results to the ci-results branch
        if: always()
        env:
          RUN: ${{ github.run_number }}
          TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/emu
          cp -r shots emu-logs /tmp/emu/ 2>/dev/null || true
          mkdir -p "/tmp/out-emu/emulator-$RUN"
          cp -r /tmp/emu/. "/tmp/out-emu/emulator-$RUN/" 2>/dev/null || true
          cp -r "/tmp/out-emu/emulator-$RUN" /tmp/out-emu/emulator-latest
          bash .github/scripts/push-results.sh /tmp/out-emu "emulator results of build $RUN"
