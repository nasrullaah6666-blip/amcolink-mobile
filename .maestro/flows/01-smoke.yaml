# Smoke test on an Android emulator: the app opens and every tab can be reached.
appId: com.amcolink.app.dev
---
- launchApp:
    clearState: true
# The emulator sometimes shows "... is not responding" for its own launcher: dismiss it if present.
- tapOn:
    text: "Wait"
    optional: true
- extendedWaitUntil:
    visible: "The latest finds"
    timeout: 60000
- takeScreenshot: shots/01-home
- assertVisible: "Property"
- tapOn: "Saved"
- takeScreenshot: shots/02-saved
- tapOn: "Account"
- scrollUntilVisible:
    element:
      text: "Test build · connected to STAGING"
    direction: DOWN
    timeout: 15000
- takeScreenshot: shots/03-account
- tapOn: "Post Ad"
- takeScreenshot: shots/04-post-ad
- tapOn: "Home"
- assertVisible: "The latest finds"
