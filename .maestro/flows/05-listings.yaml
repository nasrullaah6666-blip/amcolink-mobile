# With the staging test data: open a listing, its seller's page, Deals and Property lists.
appId: com.amcolink.app.dev
---
- launchApp
# The emulator sometimes shows "... is not responding" for its own launcher: dismiss it if present.
- tapOn:
    text: "Wait"
    optional: true
- extendedWaitUntil:
    visible: "The latest finds"
    timeout: 60000
- takeScreenshot: shots/15-home-with-listings
- scrollUntilVisible:
    element:
      text: ".*Samsung Galaxy A15.*"
    direction: DOWN
    timeout: 30000
- tapOn: ".*Samsung Galaxy A15.*"
# The listing has opened when its main button shows (the safety note is lower down since the WhatsApp questions came).
- extendedWaitUntil:
    visible: "Share to WhatsApp Status"
    timeout: 30000
- takeScreenshot: shots/16-listing
- scrollUntilVisible:
    element:
      text: ".*View profile and all ads.*"
    direction: DOWN
- tapOn: ".*View profile and all ads.*"
- extendedWaitUntil:
    visible: ".*Juma Electronics.*"
    timeout: 30000
- takeScreenshot: shots/17-shop
- back
- back
- tapOn: "Explore"
- tapOn: "Deals.*"
# Staging's database clears the seeded price-drop dates on insert, so Deals may be empty there: just record it.
- extendedWaitUntil:
    visible: "Items discounted 30% or more in the last 7 days."
    timeout: 30000
- takeScreenshot: shots/18-deals
- back
- back
# Home is still scrolled down from the listing step: scroll back up to the category tiles.
- scrollUntilVisible:
    element:
      text: "Property"
    direction: UP
    timeout: 30000
- tapOn: "Property"
- extendedWaitUntil:
    visible: ".*apartment for rent.*"
    timeout: 30000
- takeScreenshot: shots/19-property-rent
- tapOn: "For sale"
- extendedWaitUntil:
    visible: ".*Villa for sale.*"
    timeout: 30000
- takeScreenshot: shots/20-property-sale
