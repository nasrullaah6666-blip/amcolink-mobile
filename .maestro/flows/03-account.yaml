# Signed-out Account tab, Sign in, Create account and Forgot password screens open and show their forms.
appId: com.amcolink.app.dev
---
# The emulator's Google Play services sometimes crash; Android then closes apps that use its web view (the
# security check). That is the emulator, not the app (build 20 log), so the whole flow is tried once more.
- retry:
    maxRetries: 1
    commands:
      - launchApp
      # The emulator sometimes shows "... is not responding" for its own launcher: dismiss it if present.
      - tapOn:
          text: "Wait"
          optional: true
      - extendedWaitUntil:
          visible: "The latest finds"
          timeout: 60000
      - tapOn: "Account"
      - assertVisible: "HELP"
      - tapOn:
          text: "Sign in"
          index: 0
      - extendedWaitUntil:
          visible: "Welcome back to Amcolink."
          timeout: 15000
      # The security check must be switched on in this build (site key present) and load Cloudflare's box.
      - assertNotVisible: "The security check is not set up in this build, so sign-in is turned off."
      - extendedWaitUntil:
          visible: "Security check"
          timeout: 20000
      - waitForAnimationToEnd:
          timeout: 8000
      - takeScreenshot: shots/11-sign-in
      - tapOn: "Forgot password?"
      - assertVisible: "Reset your password"
      - takeScreenshot: shots/12-forgot-password
      - tapOn: "Back to sign in"
      - tapOn: ".*Create account"
      - assertVisible: "Join Amcolink for free."
      - takeScreenshot: shots/13-sign-up
